<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فاحص الروابط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8eef3; --card:#ffffff; --ink:#10223a; --steel:#5b6b7f; --line:#c9d4df; --accent:#1f4fd8;
  --safe:#12805c; --warning:#b26a00; --danger:#c62828; --unknown:#5b6b7f;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.7}
main{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px}
h1{margin:0;font-size:1.5rem;font-weight:700}
.sub{margin:4px 0 22px;color:var(--steel)}
form{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#f7f9fb;color:var(--ink);
  font:inherit;direction:ltr;text-align:left}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{padding:12px 22px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#result{display:none;margin-top:24px;border-inline-start:6px solid var(--c);padding-inline-start:16px}
#verdict{font-size:1.15rem;font-weight:700;color:var(--c)}
dl{margin:14px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:8px 18px}
dt{color:var(--steel)}
dd{margin:0;overflow-wrap:anywhere}
.safe{--c:var(--safe)} .warning{--c:var(--warning)} .danger{--c:var(--danger)} .unknown{--c:var(--unknown)}
@media (max-width:480px){form{flex-direction:column}}
</style>
</head>
<body>
<main>
  <h1>🔒 فاحص الروابط</h1>
  <p class="sub">الصق أي رابط قبل ما تفتحه، ونفحصه من عدة مصادر.</p>

  <form id="form">
    <input id="url" type="text" placeholder="https://example.com" autocomplete="off" spellcheck="false" aria-label="الرابط">
    <button id="go" type="submit">افحص الرابط</button>
  </form>

  <section id="result" aria-live="polite">
    <div id="verdict"></div>
    <dl id="details"></dl>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

function addRow(label, value) {
  const dt = document.createElement('dt');
  const dd = document.createElement('dd');
  dt.textContent = label;
  dd.textContent = value;
  $('details').append(dt, dd);
}

function show(level, message) {
  $('result').className = level;
  $('result').style.display = 'block';
  $('verdict').textContent = message;
  $('details').replaceChildren();
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const url = $('url').value.trim();
  if (!url) return;

  $('go').disabled = true;
  show('unknown', 'جاري الفحص...');

  try {
    const res = await fetch('/scan', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url})
    });
    const d = await res.json();
    if (d.error) { show('danger', d.error); return; }

    show(d.level, d.message);
    addRow('الدومين', d.domain);

    const sb = d.safe_browsing;
    addRow('Google Safe Browsing',
      !sb.checked ? 'غير مفحوص' : sb.safe ? 'نظيف' : 'مُبلَّغ عنه: ' + sb.threats.join(', '));

    addRow('شهادة SSL',
      !d.ssl.has_ssl ? 'لا توجد' : d.ssl.valid ? 'صالحة حتى ' + d.ssl.expires : 'غير صالحة');

    addRow('عمر الدومين',
      d.whois.age_days === null ? 'غير معروف' : d.whois.age_days + ' يوم (منذ ' + d.whois.created + ')');
    addRow('الجهة المسجّلة', d.whois.registrar || 'غير معروفة');
  } catch (err) {
    show('danger', 'صار خطأ بالاتصال بالسيرفر');
  } finally {
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
